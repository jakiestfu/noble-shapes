name: Publish npm package

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: npm-publish-main
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install --global npm@11.17.0
      - name: Check whether this version is already published
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "noble-shapes@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.already_published == 'false'
        run: pnpm release:pack
      - name: Publish the umbrella package
        if: steps.version.outputs.already_published == 'false'
        run: npm publish release/noble-shapes-*.tgz --access public --provenance
